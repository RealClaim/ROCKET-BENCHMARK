<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;overflow:hidden;background:#8fd3f4;width:100%;height:100%}canvas{display:block}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7fc9f0);
scene.fog=new THREE.Fog(0xbfe6f7,60,420);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,1000);
camera.position.set(28,10,32);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

const sun=new THREE.DirectionalLight(0xfff3d6,1.4);
sun.position.set(60,80,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-80;sun.shadow.camera.right=80;sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;
sun.shadow.camera.far=250;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xcfe8ff,0.6));
const hemi=new THREE.HemisphereLight(0xbfe3ff,0x8a6d4a,0.5);
scene.add(hemi);

// ground
const ground=new THREE.Mesh(new THREE.CircleGeometry(300,64),new THREE.MeshStandardMaterial({color:0x6fae52}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const pad=new THREE.Mesh(new THREE.CylinderGeometry(14,14,0.6,48),new THREE.MeshStandardMaterial({color:0x555a5e}));
pad.position.y=0.3;pad.receiveShadow=true;scene.add(pad);
for(let i=0;i<8;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.3,1.5),new THREE.MeshStandardMaterial({color:0xffcc33}));
 s.position.set(Math.cos(i/8*6.28)*12,0.6,Math.sin(i/8*6.28)*12);scene.add(s);}
// distant hills
for(let i=0;i<10;i++){const h=new THREE.Mesh(new THREE.ConeGeometry(30+Math.random()*20,18+Math.random()*15,8),new THREE.MeshStandardMaterial({color:0x4f8f5c}));
 const a=Math.random()*6.28,d=180+Math.random()*80;h.position.set(Math.cos(a)*d,-2,Math.sin(a)*d);scene.add(h);}

// clouds
function makeCloud(x,y,z,s){const g=new THREE.Group();
 for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(3+Math.random()*2,8,8),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.9}));
  m.position.set((Math.random()-0.5)*6,(Math.random()-0.5)*2,(Math.random()-0.5)*4);g.add(m);}
 g.position.set(x,y,z);g.scale.setScalar(s);scene.add(g);return g;}
const clouds=[];
for(let i=0;i<14;i++){const a=Math.random()*6.28,d=40+Math.random()*140;
 clouds.push(makeCloud(Math.cos(a)*d,50+Math.random()*90,Math.sin(a)*d,1+Math.random()*1.5));}

// launch tower
const tower=new THREE.Group();
const towerMat=new THREE.MeshStandardMaterial({color:0x9aa0a6});
const towerCol=new THREE.Mesh(new THREE.BoxGeometry(1.5,34,1.5),towerMat);
towerCol.position.set(-10,17,0);towerCol.castShadow=true;tower.add(towerCol);
for(let i=0;i<8;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.3,1.6),new THREE.MeshStandardMaterial({color:0xd94b3f}));
 b.position.set(-10,4+i*4,0);tower.add(b);}
const armL=new THREE.Mesh(new THREE.BoxGeometry(6,0.6,0.6),towerMat);armL.position.set(-6,20,0);armL.castShadow=true;
const armR=armL.clone();
scene.add(tower,armL,armR);

// rocket
const rocket=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(2,2,18,32),new THREE.MeshStandardMaterial({color:0xf2f2f2,metalness:0.3,roughness:0.4}));
body.position.y=9;body.castShadow=true;rocket.add(body);
const stripe=new THREE.Mesh(new THREE.CylinderGeometry(2.02,2.02,2.5,32),new THREE.MeshStandardMaterial({color:0xd42c2c}));
stripe.position.y=13;rocket.add(stripe);
const nose=new THREE.Mesh(new THREE.ConeGeometry(2,5,32),new THREE.MeshStandardMaterial({color:0xd42c2c,metalness:0.2}));
nose.position.y=20.5;nose.castShadow=true;rocket.add(nose);
for(let i=0;i<4;i++){const fin=new THREE.Mesh(new THREE.ConeGeometry(1.6,4,3),new THREE.MeshStandardMaterial({color:0x2255aa}));
 fin.rotation.z=Math.PI;fin.position.set(Math.cos(i/4*6.28)*2.3,1.5,Math.sin(i/4*6.28)*2.3);fin.rotation.y=i/4*6.28;
 fin.scale.set(0.6,1,1.6);rocket.add(fin);}
const engineHouse=new THREE.Mesh(new THREE.CylinderGeometry(2.1,1.6,1.5,32),new THREE.MeshStandardMaterial({color:0x555555}));
engineHouse.position.y=0.2;rocket.add(engineHouse);
rocket.position.set(0,0,0);scene.add(rocket);

// flame
const flameGroup=new THREE.Group();
const coreMat=new THREE.MeshBasicMaterial({color:0xfff2b0,transparent:true,opacity:0.95});
const midMat=new THREE.MeshBasicMaterial({color:0xff9b30,transparent:true,opacity:0.85});
const outerMat=new THREE.MeshBasicMaterial({color:0xff5522,transparent:true,opacity:0.6});
const flameCore=new THREE.Mesh(new THREE.ConeGeometry(0.8,3,16),coreMat);
const flameMid=new THREE.Mesh(new THREE.ConeGeometry(1.3,5,16),midMat);
const flameOuter=new THREE.Mesh(new THREE.ConeGeometry(1.8,7,16),outerMat);
[flameCore,flameMid,flameOuter].forEach(f=>{f.rotation.x=Math.PI;f.position.y=-1;flameGroup.add(f);});
flameGroup.position.y=-0.5;flameGroup.scale.set(1,0.001,1);rocket.add(flameGroup);
const engineLight=new THREE.PointLight(0xff9944,0,40);
engineLight.position.set(0,-1,0);rocket.add(engineLight);

// smoke particles
const SMOKE_N=260;
const smokeTexCanvas=document.createElement('canvas');smokeTexCanvas.width=smokeTexCanvas.height=64;
const ctx=smokeTexCanvas.getContext('2d');
const grad=ctx.createRadialGradient(32,32,0,32,32,32);
grad.addColorStop(0,'rgba(255,255,255,0.9)');grad.addColorStop(1,'rgba(255,255,255,0)');
ctx.fillStyle=grad;ctx.fillRect(0,0,64,64);
const smokeTex=new THREE.CanvasTexture(smokeTexCanvas);
const smokeGeo=new THREE.BufferGeometry();
const smokePos=new Float32Array(SMOKE_N*3);
const smokeData=[];
for(let i=0;i<SMOKE_N;i++){smokePos[i*3]=0;smokePos[i*3+1]=-5;smokePos[i*3+2]=0;
 smokeData.push({vx:0,vy:0,vz:0,life:0,age:0});}
smokeGeo.setAttribute('position',new THREE.BufferAttribute(smokePos,3));
const smokeMat=new THREE.PointsMaterial({map:smokeTex,color:0xcccccc,size:6,transparent:true,opacity:0.55,depthWrite:false});
const smoke=new THREE.Points(smokeGeo,smokeMat);scene.add(smoke);
let smokeCursor=0;
function emitSmoke(originY,spread,count,thrust){
 for(let k=0;k<count;k++){const i=smokeCursor;smokeCursor=(smokeCursor+1)%SMOKE_N;
  const d=smokeData[i];const a=Math.random()*6.28,r=Math.random()*2;
  smokePos[i*3]=Math.cos(a)*r*spread;smokePos[i*3+1]=originY+Math.random()*1.5;smokePos[i*3+2]=Math.sin(a)*r*spread;
  d.vx=Math.cos(a)*0.03*spread;d.vz=Math.sin(a)*0.03*spread;d.vy=0.03+Math.random()*0.03*thrust;d.age=0;d.life=4+Math.random()*3;}
}

// sparks
const SPARK_N=80;
const sparkGeo=new THREE.BufferGeometry();
const sparkPos=new Float32Array(SPARK_N*3);
const sparkData=[];
for(let i=0;i<SPARK_N;i++){sparkPos[i*3+1]=-5;sparkData.push({vx:0,vy:0,vz:0,age:0,life:0});}
sparkGeo.setAttribute('position',new THREE.BufferAttribute(sparkPos,3));
const sparkMat=new THREE.PointsMaterial({color:0xffcc55,size:0.5,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false});
const sparks=new THREE.Points(sparkGeo,sparkMat);scene.add(sparks);
let sparkCursor=0;
function emitSparks(originY,thrust){
 for(let k=0;k<3;k++){const i=sparkCursor;sparkCursor=(sparkCursor+1)%SPARK_N;const d=sparkData[i];
  sparkPos[i*3]=(Math.random()-0.5)*2;sparkPos[i*3+1]=originY;sparkPos[i*3+2]=(Math.random()-0.5)*2;
  d.vx=(Math.random()-0.5)*0.15;d.vz=(Math.random()-0.5)*0.15;d.vy=-0.05-Math.random()*0.1*thrust;d.age=0;d.life=0.6+Math.random()*0.6;}
}

// vegetation
const veg=[];
for(let i=0;i<24;i++){const a=Math.random()*6.28,d=16+Math.random()*10;
 const c=new THREE.Mesh(new THREE.ConeGeometry(0.4,1.4,6),new THREE.MeshStandardMaterial({color:0x2f7d3a}));
 c.position.set(Math.cos(a)*d,0.7,Math.sin(a)*d);c.castShadow=true;scene.add(c);veg.push(c);}

const clock=new THREE.Clock();
let state='idle',thrust=0,altitude=0,camShake=0;
const IGNITE_T=3.2,LIFTOFF_T=6.4;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.05);
 const t=clock.elapsedTime;

 if(t>IGNITE_T&&state==='idle'){state='ignite';armL.rotation.z=0;armR.rotation.z=0;}
 if(t>LIFTOFF_T&&state==='ignite'){state='liftoff';}

 if(state==='idle'){thrust=Math.max(0,thrust-dt);}
 else if(state==='ignite'){thrust=Math.min(1,thrust+dt*0.6);
  armL.rotation.z=THREE.MathUtils.lerp(0,-0.9,(t-IGNITE_T)/(LIFTOFF_T-IGNITE_T));
  armR.rotation.z=-armL.rotation.z;
  camShake=thrust*0.15;}
 else if(state==='liftoff'){thrust=1;
  altitude+=dt*(2+Math.min(altitude*0.04,14));
  rocket.position.y=altitude;
  camShake=Math.max(0,0.2-altitude*0.01);
  flameGroup.scale.y=1+Math.min(altitude*0.05,3);
 }

 flameGroup.scale.set(1+thrust*0.3,Math.max(0.001,thrust*(1+Math.sin(t*40)*0.08)),1+thrust*0.3);
 engineLight.intensity=thrust*4;

 if(thrust>0.05){
  emitSmoke(rocket.position.y,4+thrust*3,Math.floor(1+thrust*2),thrust);
  if(Math.random()<thrust)emitSparks(rocket.position.y-0.5,thrust);
 }
 for(let i=0;i<SMOKE_N;i++){const d=smokeData[i];if(d.age<d.life){d.age+=dt;
  smokePos[i*3]+=d.vx;smokePos[i*3+1]+=d.vy;smokePos[i*3+2]+=d.vz;d.vy*=0.995;d.vx*=0.99;d.vz*=0.99;}
  else{smokePos[i*3+1]=-50;}}
 smokeGeo.attributes.position.needsUpdate=true;
 smokeMat.size=6+thrust*4;

 for(let i=0;i<SPARK_N;i++){const d=sparkData[i];if(d.age<d.life){d.age+=dt;
  sparkPos[i*3]+=d.vx;sparkPos[i*3+1]+=d.vy;sparkPos[i*3+2]+=d.vz;d.vy-=dt*0.2;}
  else{sparkPos[i*3+1]=-50;}}
 sparkGeo.attributes.position.needsUpdate=true;

 veg.forEach((v,i)=>{v.rotation.z=Math.sin(t*6+i)*thrust*0.4;});
 clouds.forEach((c,i)=>{c.position.x+=Math.sin(t*0.05+i)*0.01;});

 // camera
 if(state!=='liftoff'){
  camera.position.set(28+((Math.random()-0.5)*camShake),10+((Math.random()-0.5)*camShake),32+((Math.random()-0.5)*camShake));
  camera.lookAt(0,9,0);
 } else {
  const targetY=9+altitude;
  const camY=10+altitude*0.85;
  const camDist=32+Math.min(altitude*0.6,60);
  camera.position.x=THREE.MathUtils.lerp(camera.position.x,camDist*0.6+((Math.random()-0.5)*camShake),0.03);
  camera.position.y=THREE.MathUtils.lerp(camera.position.y,camY+((Math.random()-0.5)*camShake),0.03);
  camera.position.z=THREE.MathUtils.lerp(camera.position.z,camDist*0.7,0.03);
  camera.lookAt(0,targetY,0);
 }

 renderer.render(scene,camera);
}
animate();
</script>
</body></html>
