const s=t-TL,y=s>0?1.4*Math.pow(s,2.2):0,v=s>0?3.08*Math.pow(s,1.2):0,thr=sm(5,12.5,t),bl=thr*Math.exp(-y/60);
const amp=sm(6,12.5,t)*(s<0?.1:.06);R.position.set(Math.sin(t*70)*amp,PT+2.6+y,Math.cos(t*63)*amp);R.rotation.z=Math.sin(t*55)*amp*.02;
arms.forEach((a,i)=>a.rotation.y=-sm(TL-1.6+i*.2,TL-.2+i*.2,t)*1.35);
// flames
const flick=.93+.07*Math.sin(t*41);let anyI=0;
flames.forEach((f,i)=>{const I=sm(f.e[4],f.e[4]+3,t);anyI=Math.max(anyI,I);f.g.visible=I>.01;if(!f.g.visible)return;
const len=Math.min(150,(9+36*thr)*I*(1+v*.012))*(.93+.07*Math.sin(t*47+i*2)),rr=f.e[3]*(.7+.5*thr)*(1+I*.2);
f.ls.forEach(l=>{l.m.scale.set(rr*l.rs,len*l.ls,rr*l.rs);l.m.material.uniforms.t.value=t+i;l.m.material.uniforms.k.value=I*(.5+.5*thr)});
if(i<5)bells[i].material.emissiveIntensity=I*1.2});
const ey=R.position.y-2.2;
fireLight.position.set(0,Math.max(ey-2,1.5),0);fireLight.intensity=5*thr*flick;
eGlow.position.set(0,ey,0);eGlow.scale.setScalar((6+34*thr)*anyI*flick+.01);
gGlow.scale.setScalar(70*bl*flick+.01);gGlow.material.opacity=.7;
rings.forEach((r,i)=>{const q=t-(i?TL-.3:9);const on=q>0&&q<3.5;r.visible=on;if(on){r.scale.setScalar(4+q*38);r.material.opacity=.4*(1-q/3.5)*(i?1:.6)}});
// emissions
if(t<TL+4){for(let n=N(14*(1-sm(6,11,t))+3,dt);n-->0;){const sd=Math.random()<.5?-1:1;smoke.emit(sd*2.6,R.position.y+rnd(6,24),rnd(-1,1),sd*rnd(.5,2.5),rnd(.3,1.2),rnd(-1,1),rnd(4,7),.8,rnd(3,5),.4,.5,.4,1,1,1)}
for(let n=N(6,dt);n-->0;){const a=rnd(0,6.283),r=rnd(6,40);smoke.emit(Math.cos(a)*r,3.4,Math.sin(a)*r,Math.cos(a)*rnd(.5,2),.2,Math.sin(a)*rnd(.5,2),8,6,14,.2,.3,.1,.95,.97,1)}}
if(bl>.02){
for(let n=N(bl*300,dt);n-->0;){const a=rnd(0,6.283),r=rnd(10,16),sp=rnd(10,32)*(.5+bl);smoke.emit(Math.cos(a)*r,rnd(.5,3),Math.sin(a)*r,Math.cos(a)*sp,rnd(1,6),Math.sin(a)*sp,rnd(5,9),4,rnd(18,34),rnd(.5,.85),.6,1.2,1,.85,.65)}
for(let n=N(bl*100,dt);n-->0;){const a=rnd(0,6.283),r=rnd(4,10);smoke.emit(Math.cos(a)*r,rnd(.5,3),Math.sin(a)*r,Math.cos(a)*rnd(2,8),rnd(8,20),Math.sin(a)*rnd(2,8),rnd(5,8),5,rnd(16,26),rnd(.5,.8),.6,3,1,.75,.5)}
for(let n=N(bl*130,dt);n-->0;){const a=rnd(0,6.283),r=rnd(8,15),sp=rnd(8,26);smoke.emit(Math.cos(a)*r,rnd(.3,1.5),Math.sin(a)*r,Math.cos(a)*sp,rnd(0,2),Math.sin(a)*sp,5,3,rnd(12,22),.7,.5,.3,.78,.63,.45)}
for(let n=N(bl*80,dt);n-->0;){const a=rnd(0,6.283),sp=rnd(10,38);spark.emit(Math.cos(a)*8,3.4,Math.sin(a)*8,Math.cos(a)*sp,rnd(6,24),Math.sin(a)*sp,rnd(1.5,3),.6,.2,1,.2,-28,1,.65,.2)}
for(let n=N(bl*30,dt);n-->0;){const a=rnd(0,6.283),r=rnd(6,20);spark.emit(Math.cos(a)*r,3.4,Math.sin(a)*r,rnd(-3,3),rnd(3,9),rnd(-3,3),rnd(3,5),.8,.3,.8,.3,6,1,.5,.1)}}
if(y>2&&thr>.5){const seg=ey-prevEy;for(let n=N(240*thr,dt);n-->0;){const yy=ey-Math.random()*Math.max(seg,0);smoke.emit(rnd(-1.6,1.6),yy-rnd(0,3),rnd(-1.6,1.6),rnd(-3,3),-rnd(2,8),rnd(-3,3),rnd(9,14),3.5,rnd(16,26)+y*.02,.55,.5,0,1,.92,.85)}}
prevEy=ey;
flames.forEach((f,i)=>{const I=sm(f.e[4],f.e[4]+3,t);if(I<.02)return;const rs=f.e[3]/.75,ex=R.position.x+f.e[0],ez=f.e[1],eyy=R.position.y+f.e[2];
for(let n=N(50*I*(1+.5*thr),dt);n-->0;)fire.emit(ex+rnd(-.4,.4),eyy+rnd(0,1),ez+rnd(-.4,.4),rnd(-2,2)+f.e[0]*2,-rnd(25,55)*(.3+thr)+v*.4,rnd(-2,2)+ez*2,rnd(.5,1.1),rnd(1.5,2.5)*rs,rnd(4,8)*rs,.6,1.2,0,1,.85,.4);
for(let n=N(30*thr*I,dt);n-->0;)spark.emit(ex,eyy,ez,rnd(-8,8),-rnd(5,25)+v*.3,rnd(-8,8),rnd(1,2.4),.5,.1,1,.3,-18,1,.75,.3)});
grass(t,bl);debris(dt,bl);
smoke.update(dt);fire.update(dt);spark.update(dt);cloudG.rotation.y+=dt*.002;
blinkers.forEach((b,i)=>b.visible=Math.sin(t*4+i*1.7)>0);
// camera
const k=1-Math.exp(-dt*(t<TL?3:7));ly+=(19+y+v*.12-ly)*k;
const Rr=58+Math.min(y*.05,45),ang=.6+t*.012,sh=sm(6,12.5,t)*.035+(s>0?.45*Math.exp(-s/3)+.08*sm(0,2,s):0);
camera.position.set(Math.sin(ang)*Rr+Math.sin(t*37.1)*sh,ly-8+Math.min(y*.06,60)+Math.sin(t*53.3+1)*sh,Math.cos(ang)*Rr+Math.sin(t*44.7+2)*sh);
camera.lookAt(0,ly,0);
const fov=50+Math.min(v*.03,8);if(Math.abs(fov-camera.fov)>.01){camera.fov=fov;camera.updateProjectionMatrix()}
SC.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(fov*Math.PI/360));
sky.position.copy(camera.position);
renderer.render(scene,camera)}
resize();loop();
</script></body></html>
